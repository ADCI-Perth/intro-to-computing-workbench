#------------------------------------------------------------
# Values for this lesson.
#------------------------------------------------------------

# Custom carpentry type, so no Carpentries branding is shown
carpentry: 'adci'

# Used as the alt text for the logo
carpentry_description: "ADCI"

# Overall title for pages.
title: 'Introduction to Computing'

# Short description used in the page metadata (sandpaper reads the key 'desc')
desc: 'A six-week beginner course from ADCI (at most 6 hours a week, browser only) on how computers work, how data is stored and moved, and how computing affects society. It prepares learners for computing study in cyber security or data science.'

# Date the lesson was created (YYYY-MM-DD)
created: '2026-11-23'

# Comma-separated list of keywords for the lesson
keywords: 'computing, hardware, binary, operating systems, algorithms, networks, cyber security, privacy, beginner, ADCI'

# Life cycle stage of the lesson: pre-alpha, alpha, beta, stable, retired
life_cycle: 'pre-alpha'

# License of the lesson materials
license: 'To be confirmed (see LICENSE)'

# Link to the source repository for this lesson
source: 'https://github.com/ADCI-Perth/intro-to-computing-workbench'

# Default branch of your lesson
branch: 'main'

# Who to contact if there are any issues
contact: 'FIXME-course-contact@adci.edu.au'

# Order of episodes in your lesson
episodes:
- week-1.md
- week-2.md
- week-3.md
- week-4.md
- week-5.md
- week-6.md

# Information for Learners
learners:
- setup.md
- reference.md

# Information for Instructors
instructors:
- instructor-notes.md

# Learner Profiles
profiles:
- learner-profiles.md

# ADCI fork of the theme, which holds the ADCI logo and favicons
varnish: 'ADCI-Perth/varnish'
